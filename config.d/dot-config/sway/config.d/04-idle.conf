### Lockscreen config - requires swaylock and swayidle packages (see package.list.d/*/XX-desktop.list)

# This will the screen after 300 seconds of inactivity, then turn off
# the displays after another 300 seconds, and turn the screens back on when
# resumed.

# It will also lock teh screen before the computer goes to sleep.
exec swayidle -w \
         timeout 300 'swaylock -f -c 000000' \
         timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
         before-sleep 'swaylock -f -c 000000'

