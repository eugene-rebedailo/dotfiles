### Variables to make binding easier later

# Super key
set $mod Mod4

# We're vimin' now
set $left h
set $down j
set $up k
set $right l

# Screenshot key
set $screenshot Print

# Helpers to bind commands to start applications
set $term alacritty
set $menu "wofi --show=drun -I"


# Workspace bindings
set $ws1 "1:Main"
set $ws2 "2:Web"
set $ws3 "3:Discord"
